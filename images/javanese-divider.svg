<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 50" width="100%" height="auto">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0" />
      <stop offset="25%" stop-color="#C5A059" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="1" />
      <stop offset="75%" stop-color="#C5A059" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left horizontal tapering line -->
  <line x1="20" y1="25" x2="160" y2="25" stroke="url(#divGold)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="165" cy="25" r="2" fill="#D4AF37" />

  <!-- Right horizontal tapering line -->
  <line x1="240" y1="25" x2="380" y2="25" stroke="url(#divGold)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="235" cy="25" r="2" fill="#D4AF37" />

  <!-- Central Lotus / Surya Emblem -->
  <g transform="translate(200, 25)">
    <!-- Central diamond -->
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#D4AF37" fill-opacity="0.25" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3.5" fill="#D4AF37" />
    
    <!-- Left petal swirl -->
    <path d="M -12,0 C -18,-8 -24,-4 -22,2 C -20,6 -15,4 -12,0" fill="none" stroke="#D4AF37" stroke-width="1.2" />
    <!-- Right petal swirl -->
    <path d="M 12,0 C 18,-8 24,-4 22,2 C 20,6 15,4 12,0" fill="none" stroke="#D4AF37" stroke-width="1.2" />

    <!-- Top & bottom buds -->
    <circle cx="0" cy="-16" r="1.5" fill="#D4AF37" />
    <circle cx="0" cy="16" r="1.5" fill="#D4AF37" />
  </g>
</svg>
