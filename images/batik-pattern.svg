<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <style>
      .kawung-line {
        fill: none;
        stroke: #C5A059;
        stroke-width: 0.8;
        stroke-opacity: 0.18;
      }
      .kawung-dot {
        fill: #C5A059;
        fill-opacity: 0.25;
      }
      .kawung-fill {
        fill: #C5A059;
        fill-opacity: 0.03;
      }
    </style>
  </defs>

  <!-- Kawung 4-lobed intersection circles -->
  <!-- Center intersection -->
  <ellipse cx="40" cy="20" rx="14" ry="20" class="kawung-line kawung-fill" transform="rotate(45 40 20)" />
  <ellipse cx="40" cy="20" rx="14" ry="20" class="kawung-line kawung-fill" transform="rotate(-45 40 20)" />
  
  <ellipse cx="40" cy="60" rx="14" ry="20" class="kawung-line kawung-fill" transform="rotate(45 40 60)" />
  <ellipse cx="40" cy="60" rx="14" ry="20" class="kawung-line kawung-fill" transform="rotate(-45 40 60)" />

  <ellipse cx="0" cy="40" rx="14" ry="20" class="kawung-line kawung-fill" transform="rotate(45 0 40)" />
  <ellipse cx="0" cy="40" rx="14" ry="20" class="kawung-line kawung-fill" transform="rotate(-45 0 40)" />

  <ellipse cx="80" cy="40" rx="14" ry="20" class="kawung-line kawung-fill" transform="rotate(45 80 40)" />
  <ellipse cx="80" cy="40" rx="14" ry="20" class="kawung-line kawung-fill" transform="rotate(-45 80 40)" />

  <!-- Diagonal crosses -->
  <circle cx="40" cy="40" r="2.5" class="kawung-dot" />
  <circle cx="0" cy="0" r="2.5" class="kawung-dot" />
  <circle cx="80" cy="0" r="2.5" class="kawung-dot" />
  <circle cx="0" cy="80" r="2.5" class="kawung-dot" />
  <circle cx="80" cy="80" r="2.5" class="kawung-dot" />

  <!-- Cross intersection dots -->
  <circle cx="20" cy="20" r="1.5" class="kawung-dot" />
  <circle cx="60" cy="20" r="1.5" class="kawung-dot" />
  <circle cx="20" cy="60" r="1.5" class="kawung-dot" />
  <circle cx="60" cy="60" r="1.5" class="kawung-dot" />
</svg>
