<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>

  <g stroke="url(#cornerGold)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corner Outer Border lines -->
    <path d="M 8,90 L 8,8 L 90,8" stroke-width="2" />
    <path d="M 16,75 L 16,16 L 75,16" stroke-dasharray="3,3" stroke-width="1" />

    <!-- Corner vertex ornament -->
    <circle cx="8" cy="8" r="3" fill="url(#cornerGold)" />
    <circle cx="16" cy="16" r="2" fill="url(#cornerGold)" />

    <!-- Javanese floral curl in corner -->
    <path d="M 16,16 C 28,16 34,26 28,34 C 22,40 16,30 24,24" />
    <path d="M 16,16 C 16,28 26,34 34,28 C 40,22 30,16 24,24" />
    
    <!-- Outer accent dots -->
    <circle cx="8" cy="95" r="2" fill="url(#cornerGold)" />
    <circle cx="95" cy="8" r="2" fill="url(#cornerGold)" />
  </g>
</svg>
